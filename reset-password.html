<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Knight Labs — Reset Password</title><meta name="description" content="Choose a new password for your Knight Labs account."><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="assets/knight-labs-crest-icon-transparent.png"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4af37;--gold2:#fff0a8;--gold3:#8c6713;--cream:#fff7df;--paper:#f5efe5;--ink:#11100b;--muted:#716958;--line:#dac89a;--shadow:0 28px 80px rgba(20,15,3,.14)}
body{font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.42;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,calc(100% - 42px));margin:0 auto}
.hero{color:var(--cream);background:radial-gradient(circle at 78% 21%,rgba(212,175,55,.22),transparent 28%),linear-gradient(135deg,#030303,#080805 56%,#171005)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:24px}
.brand{display:flex;align-items:center;gap:13px;font-weight:950;letter-spacing:-.04em}
.brand img{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(212,175,55,.35))}
.hero-inner{padding:52px 0 60px}
.kicker{color:var(--gold2);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:950;margin-bottom:14px}
h1{font-size:clamp(38px,6vw,68px);line-height:.92;letter-spacing:-.07em}
.lead{margin-top:18px;max-width:640px;color:rgba(255,247,223,.7);font-size:18px}
main{flex:1;padding:52px 0 70px}
.panel{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:26px;background:#fffdf8;box-shadow:var(--shadow);padding:34px}
.field{display:grid;gap:8px;margin-bottom:18px}
.field label{font-weight:900;font-size:14px}
.field input{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;font:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.hint{color:var(--muted);font-size:13px}
.btn{width:100%;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:13px 20px;border:0;font:inherit;font-weight:950;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#090703;transition:.18s}
.btn:hover:not([disabled]){transform:translateY(-2px);box-shadow:0 12px 30px rgba(212,175,55,.26)}
.btn[disabled]{background:#e3ddcd;color:#9a9384;cursor:not-allowed;filter:grayscale(1);transform:none}
.btn.secondary{background:#fffdf8;color:#765505;border:1px solid var(--line);margin-top:12px}
.message{margin-bottom:18px;font-weight:900;padding:13px 16px;border-radius:14px;font-size:14px;display:none}
.message.error{color:#b3261e;background:#fdeceb;border:1px solid #f2c6c2;display:block}
.message.success{color:#3f6b1f;background:#eef5e2;border:1px solid #cfe3b1;display:block}
.message.info{color:#6b5410;background:#fff8e3;border:1px solid #ecd9a4;display:block}
.strength{height:6px;border-radius:999px;background:#eee6d2;overflow:hidden;margin-top:2px}
.strength span{display:block;height:100%;width:0;border-radius:999px;transition:width .2s,background .2s}
.footer{background:#030303;color:rgba(255,247,223,.5);padding:26px 0;font-size:12px}
@media(max-width:680px){.panel{padding:24px;border-radius:20px}.hero-inner{padding:40px 0 46px}}
</style><link rel="stylesheet" href="assets/theme.css"><script src="assets/theme.js"></script>
</head><body>

<div class="hero">
  <header class="wrap topbar">
    <a class="brand" href="index.html"><img src="assets/knight-labs-crest-icon-transparent.png" alt="Knight Labs crest"><span>Knight Labs</span></a>
  </header>
  <div class="wrap hero-inner">
    <div class="kicker">Account Security</div>
    <h1>Reset password.</h1>
    <p class="lead">Choose a new password for your Knight Labs account. The link you followed can only be used once.</p>
  </div>
</div>

<main class="wrap">
  <div class="panel">
    <p id="message" class="message" role="status" aria-live="polite"></p>

    <form id="resetForm" novalidate>
      <p class="hint" id="accountLine" style="margin-bottom:18px"></p>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" placeholder="At least 6 characters">
        <div class="strength" aria-hidden="true"><span id="strengthBar"></span></div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Re-enter your new password">
      </div>
      <button class="btn" type="submit" id="submitBtn">Update Password</button>
    </form>

    <a class="btn secondary" href="account.html" id="signInLink" style="display:none">Go to Sign In</a>
  </div>
</main>

<footer class="footer"><div class="wrap">For research and laboratory use only. Not intended for human or veterinary consumption.</div></footer>

<script>
(function(){
  var MIN_LENGTH=6;
  var form=document.getElementById('resetForm');
  var messageEl=document.getElementById('message');
  var accountLine=document.getElementById('accountLine');
  var passwordInput=document.getElementById('newPassword');
  var confirmInput=document.getElementById('confirmPassword');
  var submitBtn=document.getElementById('submitBtn');
  var signInLink=document.getElementById('signInLink');
  var strengthBar=document.getElementById('strengthBar');

  var token=new URLSearchParams(location.search).get('token')||'';

  function show(text,kind){
    messageEl.textContent=text;
    messageEl.className='message '+kind;
  }
  function fail(text){
    show(text,'error');
    form.style.display='none';
    signInLink.style.display='inline-flex';
  }
  function post(path,body){
    return fetch(path,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    }).then(function(res){
      return res.json().catch(function(){return {};}).then(function(data){
        return {status:res.status,data:data||{}};
      });
    });
  }

  var TOKEN_ERRORS={
    invalid_token:'This reset link is not valid. Request a new one from your account page.',
    token_used:'This reset link has already been used. Request a new one if you still need to change your password.',
    token_expired:'This reset link has expired. Request a new one from your account page.'
  };

  // Password strength meter (guidance only — the server enforces the minimum)
  passwordInput.addEventListener('input',function(){
    var value=passwordInput.value;
    var score=0;
    if(value.length>=MIN_LENGTH)score++;
    if(value.length>=12)score++;
    if(/[A-Z]/.test(value)&&/[a-z]/.test(value))score++;
    if(/[0-9]/.test(value))score++;
    if(/[^A-Za-z0-9]/.test(value))score++;
    var pct=[0,25,45,65,85,100][Math.min(score,5)];
    var color=score<=1?'#d98b7a':(score<=3?'#dcb14a':'#7ba24f');
    strengthBar.style.width=pct+'%';
    strengthBar.style.background=color;
  });

  if(!token){
    fail('No reset token was found in this link. Open the link from your email again, or request a new one.');
    return;
  }

  // Check the token before showing the form, so a dead link fails fast.
  post('/api/validate-reset',{token:token}).then(function(result){
    var data=result.data;
    if(data.ok){
      accountLine.textContent='Setting a new password for '+data.email+'.';
      show('Link verified. Choose your new password below.','info');
    }else{
      fail(TOKEN_ERRORS[data.code]||'This reset link cannot be used.');
    }
  }).catch(function(){
    fail('Could not reach the server. Start it with: python server.py');
  });

  form.addEventListener('submit',function(event){
    event.preventDefault();
    var password=passwordInput.value;
    var confirm=confirmInput.value;

    if(password.length<MIN_LENGTH){
      show('Password must be at least '+MIN_LENGTH+' characters.','error');
      return;
    }
    if(password!==confirm){
      show('The two passwords do not match.','error');
      return;
    }

    submitBtn.disabled=true;
    submitBtn.textContent='Updating…';

    post('/api/reset-password',{token:token,password:password}).then(function(result){
      var data=result.data;
      if(data.ok){
        show('Your password has been updated. You can now sign in with your new password.','success');
        form.style.display='none';
        signInLink.style.display='inline-flex';
        return;
      }
      if(TOKEN_ERRORS[data.code]){
        fail(TOKEN_ERRORS[data.code]);
        return;
      }
      if(data.code==='weak_password'){
        show('Password must be at least '+MIN_LENGTH+' characters.','error');
      }else{
        show('Could not update your password. Please try again.','error');
      }
      submitBtn.disabled=false;
      submitBtn.textContent='Update Password';
    }).catch(function(){
      show('Could not reach the server. Start it with: python server.py','error');
      submitBtn.disabled=false;
      submitBtn.textContent='Update Password';
    });
  });
})();
</script>
  <script src="assets/analytics.js" defer></script>
</body></html>
