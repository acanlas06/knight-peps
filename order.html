<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Knight Labs — Your Order</title><meta name="description" content="View your Knight Labs order."><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="assets/knight-labs-crest-icon-transparent.png"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d4af37;--gold2:#fff0a8;--gold3:#8c6713;--cream:#fff7df;--paper:#f5efe5;--ink:#11100b;--muted:#716958;--line:#dac89a;--shadow:0 28px 80px rgba(20,15,3,.14)}
body{font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.42;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
.wrap{width:min(1180px,calc(100% - 42px));margin:0 auto}
.hero{color:var(--cream);background:radial-gradient(circle at 78% 21%,rgba(212,175,55,.22),transparent 28%),linear-gradient(135deg,#030303,#080805 56%,#171005)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:24px}
.brand{display:flex;align-items:center;gap:13px;font-weight:950;letter-spacing:-.04em}
.brand img{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(212,175,55,.35))}
nav{display:flex;gap:18px;font-size:14px;font-weight:850;color:rgba(255,247,223,.72)}
nav a:hover{color:#fff}
.hero-inner{padding:48px 0 56px}
.kicker{color:var(--gold2);letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:950;margin-bottom:14px}
h1{font-size:clamp(34px,5.5vw,60px);line-height:.94;letter-spacing:-.06em}
.lead{margin-top:16px;max-width:620px;color:rgba(255,247,223,.7);font-size:17px}
main{flex:1;padding:44px 0 70px}
.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.panel{border:1px solid var(--line);border-radius:22px;background:#fffdf8;box-shadow:var(--shadow);padding:28px}
.panel-head{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:16px}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.order-no{font-size:24px;font-weight:950;letter-spacing:-.03em}
.status-pill{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080604;font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;padding:6px 13px;border-radius:999px}
.status-pill.s-unpaid{background:rgba(229,83,75,.14);color:#b8342c;border:1px solid rgba(229,83,75,.42)}
.status-pill.s-reported{background:rgba(212,175,55,.18);color:#8c6713;border:1px solid rgba(212,175,55,.5)}
.status-pill.s-paid{background:rgba(123,162,79,.18);color:#456d24;border:1px solid rgba(123,162,79,.45)}
.status-pill.s-delivered{background:rgba(120,120,120,.14);color:#57564f;border:1px solid rgba(120,120,120,.35)}
.progress{display:flex;gap:6px;margin-top:18px}
.progress span{flex:1;height:5px;border-radius:999px;background:#eadbb2}
.progress span.done{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.progress-label{margin-top:9px;font-size:12px;color:var(--muted)}
.meta{color:var(--muted);font-size:13px}
.item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid #eadbb2}
.item-name{font-weight:900;font-size:15px}
.item-sub{color:var(--muted);font-size:13px;margin-top:2px}
.item-price{font-weight:900;white-space:nowrap}
.totals{display:flex;justify-content:space-between;gap:16px;padding-top:16px;margin-top:6px;border-top:2px solid var(--line);font-size:20px;font-weight:950}
.addr{color:var(--muted);font-size:14px;line-height:1.75}
.addr strong{color:var(--ink)}
.note{margin-top:18px;border:1px dashed var(--line);border-radius:16px;background:#fffaf0;padding:16px;color:var(--muted);font-size:13px;line-height:1.6}
.state{border:1px solid var(--line);border-radius:22px;background:#fffdf8;box-shadow:var(--shadow);padding:34px;text-align:center;max-width:620px;margin:0 auto}
.state h2{font-size:22px;letter-spacing:-.02em;margin-bottom:10px}
.state p{color:var(--muted);font-size:15px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;border-radius:999px;padding:12px 22px;font-weight:950;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#090703}
.btn:hover{transform:translateY(-2px)}
.footer{background:#030303;color:rgba(255,247,223,.5);padding:26px 0;font-size:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
@media(max-width:680px){.panel{padding:20px;border-radius:18px}.hero-inner{padding:38px 0 44px}}
</style><link rel="stylesheet" href="assets/theme.css"><script src="assets/theme.js"></script>
</head><body>

<div class="hero">
  <header class="wrap topbar">
    <a class="brand" href="index.html"><img src="assets/knight-labs-crest-icon-transparent.png" alt="Knight Labs crest"><span>Knight Labs</span></a>
    <nav><a href="index.html">Home</a><a href="supply-categories.html">Shop</a><a href="account.html">Account</a></nav>
  </header>
  <div class="wrap hero-inner">
    <div class="kicker">Order</div>
    <h1 id="heroTitle">Your order.</h1>
    <p class="lead" id="heroLead">Loading your order details…</p>
  </div>
</div>

<main class="wrap">
  <div id="orderView" style="display:none">
    <div class="layout">
      <div class="panel">
        <div class="status-row">
          <div>
            <div class="order-no" id="orderNo">—</div>
            <div class="meta" id="orderPlaced"></div>
          </div>
          <span class="status-pill" id="orderStatus">Pending Zelle Payment</span>
        </div>
        <div class="progress" id="orderProgress" aria-hidden="true"></div>
        <div class="progress-label" id="orderProgressLabel"></div>
        <div style="height:14px"></div>
        <div class="panel-head">Items</div>
        <div id="orderItems"></div>
        <div class="totals"><span>Total</span><span id="orderTotal">$0</span></div>
        <div class="note" id="zelleBox">Zelle instructions loading…</div>
      </div>

      <div class="panel">
        <div class="panel-head">Details</div>
        <div class="addr" id="orderDetails"></div>
      </div>
    </div>
  </div>

  <div class="state" id="stateBox" style="display:none">
    <h2 id="stateTitle">Order not found</h2>
    <p id="stateText"></p>
    <a class="btn" href="supply-categories.html">Browse products</a>
  </div>
</main>

<footer class="footer"><div class="wrap">For research and laboratory use only. Not intended for human or veterinary consumption.</div></footer>

<script>
(function(){
  var params=new URLSearchParams(location.search);
  var orderNumber=params.get('order')||'';
  var token=params.get('token')||'';

  var view=document.getElementById('orderView');
  var stateBox=document.getElementById('stateBox');

  function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function longDate(iso){
    var d=new Date(iso);
    if(isNaN(d.getTime()))return '';
    return d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})
      +' at '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }
  function showState(title,text){
    document.getElementById('heroTitle').textContent='Order';
    document.getElementById('heroLead').textContent=text;
    document.getElementById('stateTitle').textContent=title;
    document.getElementById('stateText').textContent=text;
    stateBox.style.display='block';
    view.style.display='none';
  }

  if(!orderNumber||!token){
    showState('Link incomplete','This link is missing its order details. Open the link from your confirmation email exactly as it was sent.');
    return;
  }

  fetch('/api/order-lookup',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({orderNumber:orderNumber,token:token})
  }).then(function(res){
    return res.json().catch(function(){return {};});
  }).then(function(data){
    if(!data.ok){
      showState('Order not found','We could not find an order for this link. Check that you opened the most recent confirmation email, or contact us for help.');
      return;
    }
    var o=data.order;
    document.getElementById('heroTitle').textContent='Order '+o.orderNumber;
    document.getElementById('heroLead').textContent=
      (o.itemCount===1?'1 item':o.itemCount+' items')+' · '+money(o.total)
      +(o.placedAt?' · placed '+longDate(o.placedAt):'');

    document.getElementById('orderNo').textContent=o.orderNumber;
    document.getElementById('orderPlaced').textContent=o.placedAt?longDate(o.placedAt):'';
    var STATUSES=['Pending Zelle Payment','Payment Reported','Paid','On its way','Delivered'];
    var STATUS_CLASS={'Pending Zelle Payment':'s-unpaid','Payment Reported':'s-reported','Unpaid':'s-unpaid','Paid':'s-paid','On its way':'','Delivered':'s-delivered','Cancelled':'s-cancelled'};
    var status=o.status||'Pending Zelle Payment';
    var cancelled=status==='Cancelled';
    var pill=document.getElementById('orderStatus');
    pill.textContent=status;
    pill.className='status-pill '+(STATUS_CLASS[status]||'');

    if(cancelled){
      // No pipeline to show — say what happened instead.
      document.getElementById('orderProgress').style.display='none';
      var when=o.cancelledAt?' on '+longDate(o.cancelledAt):'';
      document.getElementById('orderProgressLabel').textContent=
        'This order was cancelled'+when+'. '
        +(o.cancelReason?'Reason: '+o.cancelReason+'. ':'')
        +'No payment is due. Contact us if this looks wrong.';
    }else{
      // Progress bar through the four states
      var reached=STATUSES.indexOf(status);
      if(reached<0)reached=0;
      document.getElementById('orderProgress').innerHTML=STATUSES.map(function(s,i){
        return '<span class="'+(i<=reached?'done':'')+'" title="'+esc(s)+'"></span>';
      }).join('');
      var LABELS={
        'Pending Zelle Payment':'Awaiting Zelle payment. Send the exact memo code shown below.',
        'Payment Reported':'You reported the Zelle payment. Knight Labs will manually confirm receipt.',
        'Unpaid':'Awaiting Zelle payment. Send the exact memo code shown below.',
        'Paid':'Payment received. Your order is being prepared.',
        'On its way':'Your order is on its way.',
        'Delivered':'Delivered. Thanks for your order.'
      };
      document.getElementById('orderProgressLabel').textContent=LABELS[status]||'';
    }
    document.getElementById('orderTotal').textContent=money(o.total);

    document.getElementById('orderItems').innerHTML=(o.items||[]).map(function(i){
      return '<div class="item"><div><div class="item-name">'+esc(i.name)+'</div>'
        +'<div class="item-sub">'+esc(i.size)+' · Qty '+i.qty+' · '+money(i.unitPrice)+' each</div></div>'
        +'<div class="item-price">'+money(i.lineTotal)+'</div></div>';
    }).join('');

    var a=o.shippingAddress||{};
    var rows=[];
    rows.push('<strong>Contact</strong><br>'+esc(o.email)+(o.phone?'<br>'+esc(o.phone):''));
    if(a.street){
      rows.push('<strong>Shipping to</strong><br>'+esc(a.name)+'<br>'+esc(a.street)
        +'<br>'+esc(a.city)+', '+esc(a.state)+' '+esc(a.zip)+'<br>'+esc(a.country));
    }
    if(o.shippingMethod)rows.push('<strong>Fulfillment</strong><br>'+esc(o.shippingMethod));
    rows.push('<strong>Payment</strong><br>Zelle'+(o.paymentReportedAt?'<br>Reported sent: '+esc(longDate(o.paymentReportedAt)) : ''));
    document.getElementById('orderDetails').innerHTML=rows.join('<br><br>');

    var zelle=document.getElementById('zelleBox');
    var recipient=o.zelleRecipient||'ZELLE_RECIPIENT_NOT_CONFIGURED';
    var memo=o.zelleMemo||((o.orderNumber||'')+' '+(o.zellePaymentCode||''));
    if(cancelled){
      zelle.innerHTML='This order is cancelled. No Zelle payment is due.';
    }else if(status==='Paid'||status==='On its way'||status==='Delivered'){
      zelle.innerHTML='Zelle payment has been confirmed for this order.';
    }else{
      zelle.innerHTML='<strong>Zelle payment instructions</strong><br>'
        +'Amount: '+esc(money(o.total))+'<br>'
        +'Recipient: '+esc(recipient)+'<br>'
        +'Memo/code: <strong style="color:#8c6713;font-size:16px">'+esc(memo)+'</strong><br>'
        +'<span style="display:block;margin-top:8px">After sending Zelle, use the button below. This reports payment sent but does not mark it paid until admin confirms receipt.</span>'
        +'<button class="btn" type="button" id="reportZelleBtn" style="border:0;cursor:pointer;margin-top:14px">I sent the Zelle payment</button>';
      var reportBtn=document.getElementById('reportZelleBtn');
      if(reportBtn){
        reportBtn.disabled=status==='Payment Reported';
        reportBtn.textContent=status==='Payment Reported'?'Payment reported':'I sent the Zelle payment';
        reportBtn.addEventListener('click',function(){
          reportBtn.disabled=true;reportBtn.textContent='Reporting…';
          fetch('/api/report-zelle-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderNumber:orderNumber,token:token})})
            .then(function(res){return res.json().catch(function(){return {};});})
            .then(function(r){if(r.ok){location.reload();}else{reportBtn.disabled=false;reportBtn.textContent='I sent the Zelle payment';alert('Could not report payment. Please try again.');}})
            .catch(function(){reportBtn.disabled=false;reportBtn.textContent='I sent the Zelle payment';alert('Could not reach the server.');});
        });
      }
    }

    view.style.display='block';
    stateBox.style.display='none';
  }).catch(function(){
    showState('Could not load order','We could not reach the server. If you are running this locally, start it with: python server.py');
  });
})();
</script>
  <script src="assets/analytics.js" defer></script>
</body></html>
