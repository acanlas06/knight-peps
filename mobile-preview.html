/* Knight Labs card system refinement */
.card,.supply-card,.trust-card,.category{border-color:#b99431!important;border-radius:26px!important;background:linear-gradient(145deg,#fffdf8 0%,#f8edcf 100%)!important;box-shadow:0 30px 80px rgba(20,15,3,.16),inset 0 0 0 1px rgba(255,255,255,.7)!important}
.card,.supply-card,.category{position:relative;overflow:hidden;padding-top:56px!important}
.card:before,.supply-card:before,.category:before{content:"RESEARCH SUPPLY";position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid rgba(212,175,55,.34);background:#11100b;color:var(--gold2);font-size:10px;font-weight:950;letter-spacing:.18em;z-index:2}
.card:hover,.supply-card:hover,.category:hover{border-color:#ad8423!important;box-shadow:0 34px 90px rgba(20,15,3,.20),inset 0 0 0 1px rgba(255,255,255,.72)!important}
.card .btn.primary,.supply-card .btn.primary,.category .btn.primary{border-radius:7px;box-shadow:0 12px 30px rgba(118,85,5,.18)}
.badge.avail{border-color:rgba(140,103,19,.26)!important;background:rgba(255,240,168,.45)!important;color:#765505!important}
.product-info:after{display:none!important}
